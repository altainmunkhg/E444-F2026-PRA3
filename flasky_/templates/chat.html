{% extends "base.html" %}
{% block title %}Chat - Flasky{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>Chat</h1>
</div>

<div id="chat-messages"></div>

<form id="chat-form">
    <div class="input">
        <input id="message-input" class="form-control" type="text">
        <span class="btn">
            <button class="btn btn-primary" type="submit">Send</button>
        </span>
    </div>
</form>

<form action="{{ url_for('logout') }}" method="post" class="text-right" style="margin-top: 15px;">
    <button class="btn btn-default" type="submit">Logout</button>
</form>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const messages = document.getElementById('chat-messages');

    function addMessage(label, text) {
        const paragraph = document.createElement('p');
        paragraph.textContent = `${label}: ${text}`;
        messages.appendChild(paragraph);
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;

        addMessage('You', message);
        input.value = '';
        const response = await fetch('{{ url_for("chat") }}', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message})
        });
        const data = await response.json();
        addMessage('Bot', data.reply);
        input.focus();
    });
</script>
{% endblock %}
